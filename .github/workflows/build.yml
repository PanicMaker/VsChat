name: Build & Package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile & Bundle
        run: npm run build

      - name: Package VSIX
        run: npx -y @vscode/vsce package -o vschat.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vschat-vsix
          path: vschat.vsix
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vschat-vsix

      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -1 || true)"
          {
            echo "## Changes in v${VERSION}"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-merges "$PREV_TAG"..HEAD
            else
              git log --oneline --no-merges HEAD
            fi
          } > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: vschat.vsix
          target_commitish: ${{ github.sha }}
          make_latest: true
